version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: travel_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: travel_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - DATABASE_NAME=travel_journal_db
      - SECRET_KEY=super-secret-jwt-key-change-in-production
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: travel_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
